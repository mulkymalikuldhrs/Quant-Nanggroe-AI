apiVersion: v1
kind: Namespace
metadata:
  name: quant-nanggroe

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qna-api
  namespace: quant-nanggroe
  labels:
    app: qna
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qna
      component: api
  template:
    metadata:
      labels:
        app: qna
        component: api
    spec:
      containers:
      - name: api
        image: quant-nanggroe-api:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: QNAI_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: qna-secrets
              key: database-url
        - name: QNAI_REDIS_URL
          valueFrom:
            secretKeyRef:
              name: qna-secrets
              key: redis-url
        - name: QNAI_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: qna-secrets
              key: jwt-secret
        - name: QNAI_ENV
          value: "production"
        - name: QNAI_LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: qna-api-service
  namespace: quant-nanggroe
  labels:
    app: qna
spec:
  selector:
    app: qna
    component: api
  ports:
  - port: 80
    targetPort: 8000
    name: http
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qna-ingress
  namespace: quant-nanggroe
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - api.qna.dhaherlabs.com
    secretName: qna-tls
  rules:
  - host: api.qna.dhaherlabs.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: qna-api-service
            port:
              number: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qna-dashboard
  namespace: quant-nanggroe
  labels:
    app: qna
    component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qna
      component: dashboard
  template:
    metadata:
      labels:
        app: qna
        component: dashboard
    spec:
      containers:
      - name: dashboard
        image: node:20-alpine
        workingDir: /app/dashboard
        ports:
        - containerPort: 3000
          name: http
        command: ["sh", "-c", "npm install && npm run build && npm run start"]
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.qna.dhaherlabs.com"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"

