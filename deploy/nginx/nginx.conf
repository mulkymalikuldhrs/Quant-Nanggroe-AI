# =============================================================================
# Agentic AI System - Nginx Reverse Proxy Configuration
# Production-ready reverse proxy with WebSocket, SSL, security headers, and caching
# Made with love by Mulky Malikul Dhaher in Indonesia
# =============================================================================

# ---------------------------------------------------------------------------
# Global Settings
# ---------------------------------------------------------------------------

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    # ---------------------------------------------------------------------------
    # Basic HTTP Settings
    # ---------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # ---------------------------------------------------------------------------
    # Logging Format
    # ---------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time';

    log_format json_combined escape=json
        '{'
            '"time_local":"$time_local",'
            '"remote_addr":"$remote_addr",'
            '"remote_user":"$remote_user",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ---------------------------------------------------------------------------
    # Gzip Compression
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/opentype
        font/ttf
        font/woff
        font/woff2
        application/vnd.ms-fontobject;

    # ---------------------------------------------------------------------------
    # Rate Limiting Zones
    # ---------------------------------------------------------------------------
    # General request rate limiting: 30 requests/second per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    # API rate limiting: 10 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Login/auth rate limiting: 5 requests/second per IP
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Connection limiting: 50 concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Rate limiting response status
    limit_req_status 429;

    # ---------------------------------------------------------------------------
    # Upstream Definitions
    # ---------------------------------------------------------------------------
    upstream qna_api {
        server api:8000;
        keepalive 32;
    }

    # ---------------------------------------------------------------------------
    # Shared Security Headers
    # ---------------------------------------------------------------------------
    map $sent_http_content_type $cors_header {
        default "";
        ~application/json "Access-Control-Allow-Origin: $http_origin";
    }

    # ---------------------------------------------------------------------------
    # Redirect HTTP to HTTPS
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Health check endpoint on HTTP (for load balancers)
        location /health {
            proxy_pass http://qna_api/api/system/status;
            proxy_set_header Host $host;
        }

        # Let's Encrypt ACME challenge (for certificate renewal)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------------------
    # HTTPS Server
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # -------------------------------------------------------------------
        # SSL/TLS Configuration
        # -------------------------------------------------------------------
        # Replace these with your actual certificate paths
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Modern TLS configuration (Mozilla Intermediate)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # SSL session settings
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling (enable when certificates support it)
        # ssl_stapling on;
        # ssl_stapling_verify on;
        # ssl_trusted_certificate /etc/nginx/ssl/chain.pem;
        # resolver 8.8.8.8 8.8.4.4 valid=300s;
        # resolver_timeout 5s;

        # -------------------------------------------------------------------
        # Security Headers
        # -------------------------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-ancestors 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # -------------------------------------------------------------------
        # Connection Limits
        # -------------------------------------------------------------------
        limit_conn conn_limit 50;

        # -------------------------------------------------------------------
        # Basic Authentication (enable for restricted access)
        # -------------------------------------------------------------------
        # Uncomment the following lines to enable HTTP Basic Auth
        # auth_basic "Agentic AI System - Restricted Access";
        # auth_basic_user_file /etc/nginx/.htpasswd;

        # -------------------------------------------------------------------
        # Proxy Buffer Settings
        # -------------------------------------------------------------------
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # -------------------------------------------------------------------
        # Static Files with Caching
        # -------------------------------------------------------------------
        location /static/ {
            alias /app/web_interface/static/;

            # Cache static assets aggressively
            expires 30d;
            add_header Cache-Control "public, immutable";

            # Security headers for static files
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;

            # Disable access log for static files
            access_log off;

            # Open file cache for static assets
            open_file_cache max=1000 inactive=20s;
            open_file_cache_valid 60s;
            open_file_cache_min_uses 2;
            open_file_cache_errors off;
        }

        # Separate cache rules for different static asset types
        location ~* /static/.*\.(css|js)$ {
            alias /app/web_interface/static/;
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        location ~* /static/.*\.(png|jpg|jpeg|gif|ico|svg|webp)$ {
            alias /app/web_interface/static/;
            expires 90d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # -------------------------------------------------------------------
        # WebSocket Support (Socket.IO)
        # -------------------------------------------------------------------
        location /socket.io/ {
            proxy_pass http://qna_api/socket.io/;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket-specific timeouts
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Disable buffering for real-time communication
            proxy_buffering off;
            proxy_cache off;

            # Rate limiting for WebSocket
            limit_req zone=general burst=20 nodelay;
        }

        # -------------------------------------------------------------------
        # API Endpoints
        # -------------------------------------------------------------------
        location /api/ {
            # API rate limiting
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://qna_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 60s;
        }

        # -------------------------------------------------------------------
        # Authentication Endpoints (stricter rate limiting)
        # -------------------------------------------------------------------
        location ~ ^/api/(auth|login|register|forgot-password) {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass http://qna_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------------
        # Health Check Endpoint (no rate limiting)
        # -------------------------------------------------------------------
        location /api/system/status {
            proxy_pass http://qna_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            access_log off;
        }

        # -------------------------------------------------------------------
        # Metrics Endpoint (restrict to internal network)
        # -------------------------------------------------------------------
        location /metrics {
            # Only allow access from internal Docker network
            allow 172.20.0.0/16;
            allow 127.0.0.1;
            deny all;

            proxy_pass http://qna_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            access_log off;
        }

        # -------------------------------------------------------------------
        # Default Proxy to Flask App
        # -------------------------------------------------------------------
        location / {
            # General rate limiting
            limit_req zone=general burst=40 nodelay;

            proxy_pass http://qna_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Connection keepalive to upstream
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 60s;
        }

        # -------------------------------------------------------------------
        # Deny Access to Hidden Files
        # -------------------------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # -------------------------------------------------------------------
        # Custom Error Pages
        # -------------------------------------------------------------------
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /404.html {
            internal;
            return 404 '{"error": "Not Found", "status": 404}';
            add_header Content-Type application/json always;
        }

        location = /50x.html {
            internal;
            return 503 '{"error": "Service Temporarily Unavailable", "status": 503}';
            add_header Content-Type application/json always;
        }
    }
}
