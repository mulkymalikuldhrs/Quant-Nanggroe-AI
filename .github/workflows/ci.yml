name: CI — Quant-Nanggroe-AI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Lint QNA engine
        run: ruff check quant_nanggroe/ --ignore=E501,F401,F841 --quiet
      - name: Lint ai_multicolony
        run: ruff check ai_multicolony/ --ignore=E501,F401,F841 --quiet
      - name: Lint database module
        run: ruff check database/ --ignore=E501,F401,F841 --quiet
      - name: Lint connectors module
        run: ruff check connectors/ --ignore=E501,F401,F841 --quiet
      - name: Lint tests
        run: ruff check tests/ --ignore=E501,F401,F841 --quiet

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --ignore=tests/test_data \
            --ignore=tests/test_exchange \
            --ignore=tests/test_agents \
            -q \
            --tb=short \
            --cov=quant_nanggroe \
            --cov=ai_multicolony \
            --cov=database \
            --cov=connectors \
            --cov-fail-under=50 \
            --cov-report=term-missing
        env:
          QNAI_ENV: test
          QNAI_JWT_SECRET: test-jwt-secret-not-for-production

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit
      - name: Security scan QNA engine
        run: bandit -r quant_nanggroe/ -ll -ii -q
      - name: Security scan ai_multicolony
        run: bandit -r ai_multicolony/ -ll -ii -q
