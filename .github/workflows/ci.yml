name: CI

on:
  push:
    branches: [main, cl1-agent-1, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install ruff mypy
          pip install -e ".[dev]"
      - name: Ruff format check
        run: ruff format --check quant_nanggroe/ tests/
      - name: Ruff lint
        run: ruff check quant_nanggroe/ tests/
      - name: MyPy type check
        run: mypy quant_nanggroe/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --tb=short -x
        env:
          QNAI_DEBUG: "true"

  test-coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]" pytest-cov
      - name: Run coverage
        run: pytest tests/ --cov=quant_nanggroe --cov-report=term-missing --cov-fail-under=60

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t quant-nanggroe-ai:test .
