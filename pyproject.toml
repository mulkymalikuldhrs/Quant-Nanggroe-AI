[project]
name = "quant-nanggroe-ai"
version = "0.2.0"
description = "Agentic Trading Intelligence OS — Multi-agent trading framework with LangGraph orchestration, constitutional risk management, and production-grade execution"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Quant Nanggroe AI Team"},
]
readme = "README.md"
keywords = ["trading", "ai", "agents", "langgraph", "quant", "crypto", "forex"]

dependencies = [
    # Agent Framework
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-core>=0.3",
    # Data & Computation
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    # Data Sources
    "yfinance>=0.2",
    "ccxt>=4.0",
    # Database & Caching
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "redis>=5.0",
    # API Server
    "fastapi>=0.100",
    "uvicorn>=0.24",
    # HTTP & Async
    "httpx>=0.25",
    "aiohttp>=3.9",
    # Logging & CLI
    "structlog>=23.0",
    "rich>=13.0",
    "click>=8.0",
    # ML (optional core)
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
ml = [
    "xgboost>=2.0",
    "torch>=2.0",
]
alpaca = [
    "alpaca-py>=0.20",
]
polygon = [
    "polygon-api-client>=1.12",
]
data = [
    "alpaca-py>=0.20",
    "polygon-api-client>=1.12",
    "twelvedata>=0.5",
]
memory = [
    "chromadb>=0.4",
]
all = [
    "quant-nanggroe-ai[ml,data,memory]",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.5",
    "pre-commit>=3.5",
]

[project.scripts]
qnai = "quant_nanggroe.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quant_nanggroe*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests requiring API keys",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
