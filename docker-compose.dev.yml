version: "3.9"

services:
  api:
    build:
      target: builder
    command: ["uvicorn", "quant_nanggroe_ai.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - APP_ENV=development
      - LOG_LEVEL=DEBUG
      - RELOAD=true
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
