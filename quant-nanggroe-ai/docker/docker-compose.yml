version: "3.9"

services:
  quant-nanggroe-ai:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/quant_nanggroe.db
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - APP_ENV=production
    volumes:
      - app-data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  app-data:
  redis-data:
