name: CI

on:
  push:
    branches: [main, cl1-agent-1]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Ruff lint
        run: poetry run ruff check quant_nanggroe tests

      - name: Ruff format check
        run: poetry run ruff format --check quant_nanggroe tests

      - name: Mypy type check
        run: poetry run mypy quant_nanggroe
        continue-on-error: true

      - name: Run tests with coverage
        run: poetry run pytest tests/ -v --cov=quant_nanggroe --cov-report=term-missing --cov-fail-under=80

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t quant-nanggroe-ai:latest -f docker/Dockerfile .

      - name: Test Docker image
        run: docker run --rm quant-nanggroe-ai:latest python -c "import quant_nanggroe; print('OK')"
