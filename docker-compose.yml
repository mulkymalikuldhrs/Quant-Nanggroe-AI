services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qna-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - QNAI_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - QNAI_SSL_VERIFY=1
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    volumes:
      - qna_data:/app/data
      - qna_logs:/app/logs

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qna-worker
    restart: unless-stopped
    command: ["python", "qna.py", "daemon"]
    env_file:
      - path: .env
        required: false
    environment:
      - QNAI_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - QNAI_SSL_VERIFY=1
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    volumes:
      - qna_data:/app/data
      - qna_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import json, pathlib; p = pathlib.Path('data/daemons/qna_daemon.pid'); exit(0 if p.exists() and p.read_text().strip() else '1')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: qna-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    # FIX S8: Redis requires authentication — no host port mapping
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  qna_data:
  qna_logs:
