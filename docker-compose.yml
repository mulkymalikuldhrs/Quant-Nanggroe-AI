version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qna-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - QNAI_REDIS_URL=redis://redis:6379/0
      - QNAI_ALPACA_PAPER=true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    volumes:
      - qna_data:/app/data
      - qna_logs:/app/logs

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qna-worker
    restart: unless-stopped
    command: ["python", "-m", "quant_nanggroe.engine.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      - QNAI_REDIS_URL=redis://redis:6379/0
      - QNAI_ALPACA_PAPER=true
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    volumes:
      - qna_data:/app/data
      - qna_logs:/app/logs

  redis:
    image: redis:7-alpine
    container_name: qna-redis
    restart: unless-stopped
    # FIX S8: Redis only accessible within Docker network (no host port mapping)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  qna_data:
  qna_logs:
