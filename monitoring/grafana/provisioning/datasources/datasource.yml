# =============================================================================
# Agentic AI System - Grafana Datasource Provisioning
# Automatically configures Prometheus and PostgreSQL datasources on startup
# Made with love by Mulky Malikul Dhaher in Indonesia
# =============================================================================

apiVersion: 1

# Datasources to create or update
datasources:
  # ---------------------------------------------------------------------------
  # Prometheus - Primary Metrics Datasource
  # ---------------------------------------------------------------------------
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    basicAuth: false
    isDefault: true
    version: 1
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 60s
      # Custom query parameters for Prometheus
      customQueryParameters: ''
    # Secure settings (use environment variables in production)
    # secureJsonData:
    #   basicAuthPassword: ${GRAFANA_PROMETHEUS_PASSWORD}

  # ---------------------------------------------------------------------------
  # PostgreSQL - Application Database Datasource
  # ---------------------------------------------------------------------------
  - name: PostgreSQL
    type: postgres
    access: proxy
    uid: postgres
    url: postgres:5432
    database: agentic_db
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    jsonData:
      sslmode: disable
      # PostgreSQL connection settings
      postgresVersion: 1500
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      # Time series settings
      timescaledb: false
    # Secure settings - credentials from environment
    secureJsonData:
      password: ${POSTGRES_PASSWORD:-changeme_secure_password}
    user: agentic

# Datasources to delete (if they exist from previous provisioning)
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: PostgreSQL
    orgId: 1
