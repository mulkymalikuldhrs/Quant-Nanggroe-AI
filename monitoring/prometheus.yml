# =============================================================================
# Agentic AI System - Prometheus Configuration
# Scrapes metrics from the Flask app, PostgreSQL, Redis, and Nginx
# Made with love by Mulky Malikul Dhaher in Indonesia
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  # External labels applied to all metrics
  external_labels:
    cluster: 'agentic-ai-ecosystem'
    environment: 'production'
    region: 'default'

# Alertmanager configuration (enable when available)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Rule files for alerting rules
# rule_files:
#   - /etc/prometheus/rules/*.yml

# =============================================================================
# Scrape Configurations
# =============================================================================

scrape_configs:
  # ---------------------------------------------------------------------------
  # Prometheus Self-Monitoring
  # ---------------------------------------------------------------------------
  - job_name: 'prometheus'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          component: 'prometheus'
          service: 'monitoring'

  # ---------------------------------------------------------------------------
  # Agentic AI Flask Application
  # ---------------------------------------------------------------------------
  - job_name: 'agentic-ai-app'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['agentic-ai:5000']
        labels:
          component: 'flask-app'
          service: 'agentic-ai'
          framework: 'flask'
    # Relabel to add instance metadata
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'agentic-ai-app'

  # ---------------------------------------------------------------------------
  # PostgreSQL Database Metrics
  # Requires postgres_exporter sidecar
  # ---------------------------------------------------------------------------
  - job_name: 'postgresql'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['postgres:9187']
        labels:
          component: 'database'
          service: 'postgresql'
          db: 'agentic_db'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'agentic-postgres'

  # ---------------------------------------------------------------------------
  # Redis Cache Metrics
  # Requires redis_exporter sidecar
  # ---------------------------------------------------------------------------
  - job_name: 'redis'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['redis:9121']
        labels:
          component: 'cache'
          service: 'redis'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'agentic-redis'

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy Metrics
  # Requires nginx-prometheus-exporter sidecar or stub_status
  # ---------------------------------------------------------------------------
  - job_name: 'nginx'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['nginx:9113']
        labels:
          component: 'reverse-proxy'
          service: 'nginx'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'agentic-nginx'

  # ---------------------------------------------------------------------------
  # Node Exporter (Host System Metrics)
  # Requires node_exporter sidecar for CPU, memory, disk, network
  # ---------------------------------------------------------------------------
  - job_name: 'node'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: 'host'
          service: 'node-exporter'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'agentic-host'

  # ---------------------------------------------------------------------------
  # Grafana Metrics
  # ---------------------------------------------------------------------------
  - job_name: 'grafana'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['grafana:3000']
        labels:
          component: 'dashboard'
          service: 'grafana'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'agentic-grafana'
