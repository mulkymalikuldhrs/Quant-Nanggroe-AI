# HERMES QUANT OPERATING SYSTEM - Configuration
# Version: 4.0.0
# Owner: Mulky Malikul Dhaher

# ===========================================
# SYSTEM
# ===========================================
system:
  name: "Hermes Quant OS"
  version: "4.0.0"
  owner: "Mulky Malikul Dhaher"
  deployment_stage: "research_lab"  # research_lab | paper_trading | micro_live | semi_autonomous | full_autonomous

# ===========================================
# RISK RULES (HARDCODED IN SOURCE - DO NOT MODIFY HERE)
# These values are for reference only.
# Actual enforcement is in src/hermes_quant.py
# ===========================================
risk:
  max_risk_per_trade: 0.005    # 0.5% - HARDCODED
  daily_max_loss: 0.01         # 1% - HARDCODED
  weekly_max_loss: 0.03        # 3% - HARDCODED
  min_rr_ratio: 2.0            # 1:2 minimum
  min_confluence: 3             # 3/5 minimum

# ===========================================
# LLM PROVIDERS
# ===========================================
llm:
  primary:
    provider: "nvidia"
    model: "meta/llama-3.1-nemotron-70b-instruct"
    api_base: "https://integrate.api.nvidia.com/v1"
  
  fallback_1:
    provider: "groq"
    models:
      - "llama-3.1-8b-instant"
      - "llama-3.3-70b-versatile"
    api_base: "https://api.groq.com/openai/v1"
  
  fallback_2:
    provider: "opencode"
    api_base: "https://api.opencode.ai/v1"

# ===========================================
# TRADING
# ===========================================
trading:
  target_markets:
    - "XAUUSD"
    - "EURUSD"
    - "GBPUSD"
    - "BTCUSDT"
    - "SHIB"
    - "TRX"
  
  framework: "top_down"        # top_down | bottom_up
  smc_bias: "continuation"     # continuation | reversal
  scenario_count: 3            # Always 3 (bullish/bearish/neutral)
  
  timeframes:
    htf: ["4H", "1D"]          # Higher timeframe
    ltf: ["1H", "15m"]         # Lower timeframe
    entry: ["5m", "1m"]        # Entry precision

# ===========================================
# INFRASTRUCTURE
# ===========================================
infrastructure:
  watchdog:
    interval_seconds: 10
    max_restarts_per_hour: 10
    cooldown_minutes: 5
    backoff_base_seconds: 5
    backoff_cap_seconds: 120
  
  keeper:
    cron_interval_minutes: 1
  
  on_boot:
    termux_delay_seconds: 10
    systemd_after: "network.target"
    cron_delay_seconds: 30
  
  logging:
    level: "INFO"
    retention_days: 7
    max_conversation_history: 100
    max_decision_log: 50
    max_memory_files: 10

# ===========================================
# COMMUNICATION
# ===========================================
communication:
  primary_channel: "telegram"
  alert_on_crash: true
  alert_on_restart: true
  alert_on_kill_switch: true
  alert_on_risk_breach: true

# ===========================================
# WALLET TARGETS
# ===========================================
wallets:
  tron:
    address: "${WALLET_TRON}"  # Set via env var — never hardcode wallet addresses
    priority: "HIGH"
  shiba_inu:
    address: "${WALLET_SHIBA}"  # Set via env var — never hardcode wallet addresses
    priority: "MEDIUM"

# ===========================================
# SOURCE REPOSITORIES
# ===========================================
sources:
  upstream:
    name: "Nous Research Hermes Agent"
    url: "https://github.com/nousresearch/hermes"
    license: "MIT"
  
  integrated:
    - name: "Quant-Nanggroe-AI"
      url: "https://codeberg.org/Dhaher-Labs/Quant-Nanggroe-AI"
      version: "v15.2.0"
    
    - name: "AI-MultiColony-Ecosystem"
      url: "https://github.com/mulkymalikuldhrs/AI-MultiColony-Ecosystem"
      version: "v8.0.0"
    
    - name: "Vibe-Trading"
      url: "https://github.com/mulkymalikuldhrs/Vibe-Trading"
      version: "v0.1.8"
    
    - name: "AutoHedge"
      url: "https://github.com/mulkymalikuldhrs/AutoHedge"
      version: "latest"
