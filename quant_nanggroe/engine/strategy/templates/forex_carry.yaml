name: "Forex Carry Trade"
description: "Forex carry trade strategy using EMA crossover with ADX trend strength filter. Enters when short EMA is above long EMA and ADX confirms trend, exits on EMA crossbelow or trailing stop."
version: "1.0.0"
author: "Quant Nanggroe AI"
tags:
  - carry
  - forex
  - ema
  - adx
  - leveraged

universe:
  symbols: ["EURUSD", "GBPUSD", "USDJPY", "AUDUSD"]
  exchanges: ["FOREX"]

timeframe: "4h"

entry_rules:
  - indicator: "ema"
    operator: "gt"
    value: 0.0
    params:
      period: 20
      compare_ema: 50
    weight: 1.0
  - indicator: "adx"
    operator: "gt"
    value: 25
    params:
      period: 14
    weight: 0.7

exit_rules:
  - indicator: "ema"
    operator: "lt"
    value: 0.0
    params:
      period: 20
      compare_ema: 50
  - trailing_stop_pct: 2.0

risk_rules:
  max_position_pct: 10.0
  stop_loss_pct: 1.5
  max_daily_trades: 5
  max_portfolio_heat: 30.0
  max_drawdown_pct: 10.0
  min_cash_reserve_pct: 5.0
