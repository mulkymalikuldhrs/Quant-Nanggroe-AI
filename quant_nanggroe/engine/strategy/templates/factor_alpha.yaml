name: "Multi-Factor Alpha"
description: "Multi-factor alpha strategy using custom factor-based entry and exit signals across sector ETFs. Combines value, momentum, and quality factors with trailing stop protection."
version: "1.0.0"
author: "Quant Nanggroe AI"
tags:
  - factor
  - alpha
  - multi-factor
  - equity
  - etf
  - sector-rotation

universe:
  symbols: ["SPY", "QQQ", "XLK", "XLF", "XLE", "XLV"]
  exchanges: ["NYSE", "ARCA"]

timeframe: "1d"

entry_rules:
  - indicator: "factor"
    operator: "gt"
    value: 0.5
    params:
      factor_type: "momentum_score"
      lookback: 21
    weight: 0.6
  - indicator: "factor"
    operator: "gt"
    value: 0.3
    params:
      factor_type: "value_score"
      lookback: 63
    weight: 0.4

exit_rules:
  - indicator: "factor"
    operator: "lt"
    value: -0.3
    params:
      factor_type: "momentum_score"
      lookback: 21
  - trailing_stop_pct: 5.0

risk_rules:
  max_position_pct: 8.0
  stop_loss_pct: 3.0
  max_daily_trades: 5
  max_portfolio_heat: 24.0
  max_drawdown_pct: 15.0
  min_cash_reserve_pct: 10.0
