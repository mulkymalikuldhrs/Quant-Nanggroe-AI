version: 2.1

orbs:
  python: circleci/python@2.1

jobs:
  lint:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run: pip install -e ".[dev]"
      - run: ruff check quant_nanggroe/

  test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run: pip install -e ".[dev]"
      - run: pip install pytest pytest-cov
      - run: pytest tests/ --cov=quant_nanggroe --cov-report=term-missing --cov-fail-under=50 -x

workflows:
  ci:
    jobs:
      - lint
      - test
